<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelloEducation Parent — Schedule</title>
  <link rel="stylesheet" href="styling.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#085041" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HelloEducation" />
</head>
<body>
  <header class="has-actions">
    <div class="header-brand">
    <img src="images/HELLO..jpg" alt="HelloEducation" class="site-logo" />
    <h1 class="page-heading">Parent — Schedule</h1>
    </div>
    <button id="signOutBtn" class="header-signout" type="button">Sign Out</button>
  </header>

  <navigation>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="tutors.html">Tutors</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </navigation>

  <main class="auth-page">
    <section class="auth-panel dashboard-panel">
      <div class="admin-subnav">
        <a href="parent-dashboard.html">Overview</a>
        <a href="parent-children.html">My Children</a>
        <a href="parent-schedule.html" class="active">Schedule</a>
        <a href="parent-billing.html">Billing</a>
      </div>

      <h2 id="welcomeMessage">Schedule</h2>
      <p id="summaryText">Book a session for one of your children.</p>

      <div class="dashboard-grid dashboard-grid-2">
        <div class="dashboard-card">
          <h3>Request a session</h3>
          <form id="requestSessionForm" class="admin-form">
            <select id="requestChild" required>
              <option value="">Choose a child…</option>
            </select>
            <select id="requestTutor" required>
              <option value="">Choose a tutor…</option>
            </select>
            <div id="bookingCalendarWrapper" style="display:none;">
              <label for="bookingDate">Choose a date</label>
              <input id="bookingDate" type="date" />
              <div class="dashboard-actions" id="bookingTimeSlots"></div>
              <p class="card-hint" id="selectedTimeLabel">No time selected yet.</p>
            </div>
            <input id="requestSubject" type="text" placeholder="Subject" required />
            <select id="requestFormat" required>
              <option value="online">Online</option>
              <option value="faceToFace">Face-to-face</option>
            </select>
            <textarea id="requestNotes" placeholder="Anything the tutor should know (optional)" rows="2"></textarea>
            <button type="submit">Request session</button>
          </form>
          <p class="auth-feedback" id="requestFeedback"></p>
        </div>
        <div class="dashboard-card">
          <h3>Pending requests</h3>
          <ul id="myRequestsList"><li>Loading…</li></ul>
        </div>
      </div>

    </section>
  </main>

  <footer>
    <p>&copy; 2023 HelloEducation. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
    import { getFirestore, collection, query, where, getDocs, updateDoc, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-functions.js';
    import { firebaseConfig, isFirebaseConfigured } from './firebase-config.js';

    function formatLabel(session) {
      return session.format === 'faceToFace' ? 'Face-to-face' : 'Online';
    }

    const role = localStorage.getItem('helloEducationRole');
    if (role !== 'parent') {
      window.location.href = 'login.html?role=parent';
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const functions = getFunctions(app);
    const requestSessionCallable = httpsCallable(functions, 'requestSession');
    const getTutorBookedTimesCallable = httpsCallable(functions, 'getTutorBookedTimes');
    const welcomeMessage = document.getElementById('welcomeMessage');
    const summaryText = document.getElementById('summaryText');
    const requestSessionForm = document.getElementById('requestSessionForm');
    const requestChild = document.getElementById('requestChild');
    const requestTutor = document.getElementById('requestTutor');
    const bookingCalendarWrapper = document.getElementById('bookingCalendarWrapper');
    const bookingDateInput = document.getElementById('bookingDate');
    const bookingTimeSlots = document.getElementById('bookingTimeSlots');
    const selectedTimeLabel = document.getElementById('selectedTimeLabel');
    const requestSubject = document.getElementById('requestSubject');
    const requestFeedback = document.getElementById('requestFeedback');
    const myRequestsList = document.getElementById('myRequestsList');
    const signOutBtn = document.getElementById('signOutBtn');

    // Half-hour marks from 7:00am through 8:30pm — the last bookable start
    // stays within the same 7am–9pm window the hourly grid used, just at
    // twice the resolution.
    const BOOKING_SLOTS = [];
    for (let h = 7; h <= 20; h++) {
      BOOKING_SLOTS.push({ hour: h, minute: 0 });
      BOOKING_SLOTS.push({ hour: h, minute: 30 });
    }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function timeToMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }
    function timeLabel(hour, minute) {
      const period = hour < 12 ? 'am' : 'pm';
      const displayHour = hour % 12 === 0 ? 12 : hour % 12;
      return `${displayHour}:${pad2(minute)}${period}`;
    }
    function dateToLocalISO(d) {
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }
    const MAX_DAYS_AHEAD = 77; // ~11 weeks of bookable horizon, same as before

    let childUids = [];
    let selectedDateTime = null;
    let currentAvailability = []; // the selected tutor's recurring weekly slots

    async function populateChildSelect() {
      const parentDoc = await getDoc(doc(db, 'users', auth.currentUser.uid));
      childUids = (parentDoc.exists() && parentDoc.data().childUids) || [];

      if (!childUids.length) {
        requestChild.innerHTML = '<option value="">No linked children yet</option>';
        return;
      }

      const children = await Promise.all(childUids.map(async (uid) => {
        const snap = await getDoc(doc(db, 'students', uid));
        return snap.exists() ? { id: uid, ...snap.data() } : null;
      }));

      requestChild.innerHTML = '<option value="">Choose a child…</option>' + children
        .filter(Boolean)
        .map((c) => `<option value="${c.id}">${c.name}</option>`)
        .join('');
    }

    async function populateTutorSelect() {
      const snapshot = await getDocs(collection(db, 'tutors'));
      const tutors = snapshot.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));
      requestTutor.innerHTML = '<option value="">Choose a tutor…</option>' + tutors.map((tutor) =>
        `<option value="${tutor.id}" data-subject="${tutor.subject}">${tutor.name} — ${tutor.subject}</option>`
      ).join('');
    }

    function resetBooking() {
      selectedDateTime = null;
      selectedTimeLabel.textContent = 'No time selected yet.';
      bookingTimeSlots.innerHTML = '';
      bookingDateInput.value = '';
    }

    // Picking a tutor just loads their recurring weekly availability (one
    // read) and opens the date picker — nothing tutor-specific is rendered
    // until a date is actually chosen.
    async function onTutorChange() {
      const tutorId = requestTutor.value;
      const selectedOption = requestTutor.options[requestTutor.selectedIndex];
      requestSubject.value = selectedOption.dataset.subject || '';
      resetBooking();

      if (!tutorId) {
        bookingCalendarWrapper.style.display = 'none';
        currentAvailability = [];
        return;
      }

      bookingCalendarWrapper.style.display = '';
      const today = new Date();
      const maxDate = new Date(today);
      maxDate.setDate(maxDate.getDate() + MAX_DAYS_AHEAD);
      bookingDateInput.min = dateToLocalISO(today);
      bookingDateInput.max = dateToLocalISO(maxDate);

      const availabilitySnap = await getDocs(query(collection(db, 'availability'), where('tutorId', '==', tutorId)));
      currentAvailability = availabilitySnap.docs.map((d) => d.data());
    }

    // Shows just the chosen date's bookable times for the selected tutor —
    // only the real options (open and already-taken slots), not a whole
    // week's grid of mostly-empty cells.
    async function renderTimeSlotsForDate() {
      selectedDateTime = null;
      selectedTimeLabel.textContent = 'No time selected yet.';

      const dateStr = bookingDateInput.value;
      if (!dateStr) {
        bookingTimeSlots.innerHTML = '';
        return;
      }

      const selectedDate = new Date(`${dateStr}T00:00:00`);
      const dayAvailability = currentAvailability.filter((slot) => slot.dayOfWeek === selectedDate.getDay());

      if (!dayAvailability.length) {
        bookingTimeSlots.innerHTML = '<p class="card-hint">This tutor isn\'t available that day.</p>';
        return;
      }

      const availableMinutes = new Set();
      dayAvailability.forEach((slot) => {
        const startMin = timeToMinutes(slot.startTime);
        const endMin = timeToMinutes(slot.endTime);
        for (let m = startMin; m < endMin; m += 30) availableMinutes.add(m);
      });

      bookingTimeSlots.innerHTML = '<p>Loading…</p>';
      const rangeStart = new Date(selectedDate);
      const rangeEnd = new Date(selectedDate);
      rangeEnd.setDate(rangeEnd.getDate() + 1);

      let bookedResult;
      try {
        bookedResult = await getTutorBookedTimesCallable({ tutorId: requestTutor.value, rangeStart: rangeStart.toISOString(), rangeEnd: rangeEnd.toISOString() });
      } catch (error) {
        bookingTimeSlots.innerHTML = `<p>${error.message || 'Could not load available times. Please try again.'}</p>`;
        return;
      }
      const bookedTimes = new Set(bookedResult.data.bookedTimes);

      const now = new Date();
      const buttons = BOOKING_SLOTS
        .filter(({ hour, minute }) => availableMinutes.has(hour * 60 + minute))
        .map(({ hour, minute }) => {
          const cellDate = new Date(selectedDate);
          cellDate.setHours(hour, minute, 0, 0);
          if (cellDate.getTime() <= now.getTime()) return '';
          if (bookedTimes.has(cellDate.getTime())) {
            return `<button type="button" class="action-btn secondary" disabled>${timeLabel(hour, minute)} (booked)</button>`;
          }
          return `<button type="button" class="action-btn secondary" data-datetime="${cellDate.toISOString()}">${timeLabel(hour, minute)}</button>`;
        })
        .filter(Boolean)
        .join('');

      bookingTimeSlots.innerHTML = buttons || '<p class="card-hint">No available times left that day.</p>';
    }

    bookingTimeSlots.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-datetime]');
      if (!button) return;

      bookingTimeSlots.querySelectorAll('button[data-datetime]').forEach((b) => b.classList.add('secondary'));
      button.classList.remove('secondary');
      selectedDateTime = new Date(button.dataset.datetime);
      selectedTimeLabel.textContent = `Selected: ${selectedDateTime.toLocaleString()}`;
    });

    requestTutor.addEventListener('change', onTutorChange);
    bookingDateInput.addEventListener('change', renderTimeSlotsForDate);

    requestSessionForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const studentId = requestChild.value;
      if (!studentId) {
        requestFeedback.textContent = 'Choose which child this session is for.';
        return;
      }
      if (!selectedDateTime) {
        requestFeedback.textContent = 'Click an available time on the calendar first.';
        return;
      }

      requestFeedback.textContent = 'Sending request…';

      const tutorId = requestTutor.value;
      const subject = requestSubject.value.trim();
      const format = document.getElementById('requestFormat').value;
      const notes = document.getElementById('requestNotes').value.trim();

      try {
        await requestSessionCallable({ studentId, tutorId, subject, scheduledAt: selectedDateTime.toISOString(), format, notes });
        requestFeedback.textContent = 'Request sent! The tutor will confirm or decline it.';
        requestSessionForm.reset();
        await onTutorChange();
        await renderRequests();
      } catch (error) {
        requestFeedback.textContent = error.message || 'Could not send the request.';
      }
    });

    async function renderRequests() {
      if (!childUids.length) {
        myRequestsList.innerHTML = '<li>No linked children yet.</li>';
        return;
      }

      const perChild = await Promise.all(childUids.map((uid) =>
        getDocs(query(collection(db, 'sessions'), where('studentId', '==', uid), where('status', '==', 'pending')))
      ));
      const pending = perChild.flatMap((snap) => snap.docs.map((d) => ({ id: d.id, ...d.data() })));

      myRequestsList.innerHTML = pending.length
        ? pending.map((s) => `
          <li>
            <span>${s.studentEmail || 'Student'} — ${s.subject} — ${s.scheduledAt.toDate().toLocaleString()} <span class="status-badge">${formatLabel(s)}</span> <span class="status-badge">pending</span></span>
            <button class="action-btn secondary" data-session-id="${s.id}" type="button">Cancel</button>
          </li>
        `).join('')
        : '<li>No pending requests.</li>';
    }

    myRequestsList.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-session-id]');
      if (!button) return;
      await updateDoc(doc(db, 'sessions', button.dataset.sessionId), { status: 'cancelled' });
      await renderRequests();
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user && !isFirebaseConfigured()) {
        welcomeMessage.textContent = 'Schedule';
        summaryText.textContent = 'Demo mode is active. Connect Firebase to see real data.';
        return;
      }

      if (!user) {
        window.location.href = 'login.html?role=parent';
        return;
      }

      await populateChildSelect();
      await populateTutorSelect();
      renderRequests();

      // Arrives here from a tutor's "Book a Session" link on the public
      // tutors.html page (carried through login.html) — pre-select that
      // tutor and open the calendar instead of leaving the parent to find
      // them again in the dropdown. They still need to pick which child.
      const tutorIdFromUrl = new URLSearchParams(window.location.search).get('tutorId');
      if (tutorIdFromUrl && requestTutor.querySelector(`option[value="${CSS.escape(tutorIdFromUrl)}"]`)) {
        requestTutor.value = tutorIdFromUrl;
        await onTutorChange();
      }
    });

    signOutBtn.addEventListener('click', async () => {
      if (!isFirebaseConfigured()) {
        localStorage.removeItem('helloEducationRole');
        localStorage.removeItem('helloEducationUser');
        window.location.href = 'login.html?role=parent';
        return;
      }

      await signOut(auth);
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
