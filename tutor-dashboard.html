<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelloEducation Tutor Dashboard</title>
  <link rel="stylesheet" href="styling.css" />
</head>
<body>
  <header>
    <h1>HelloEducation</h1>
    <h1 class="page-heading">Tutor Dashboard</h1>
  </header>

  <navigation>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="tutors.html">Tutors</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </navigation>

  <main class="auth-page">
    <section class="auth-panel dashboard-panel">
      <h2 id="welcomeMessage">Welcome back</h2>
      <p id="summaryText">Loading your dashboard…</p>

      <div class="dashboard-grid">
        <div class="dashboard-card">
          <h3>Today’s sessions</h3>
          <ul id="sessionList"></ul>
        </div>
        <div class="dashboard-card">
          <h3>Booking requests</h3>
          <ul id="requestList"></ul>
        </div>
        <div class="dashboard-card">
          <h3>Availability</h3>
          <ul id="availabilityList"></ul>
        </div>
      </div>

      <p><a href="firebase-setup-guide.html">Need to configure Firestore and Authentication?</a></p>
      <button id="signOutBtn" type="button">Sign Out</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 HelloEducation. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.14.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.14.0/firebase-auth.js';
    import { firebaseConfig, isFirebaseConfigured } from './firebase-config.js';
    import { fetchDashboardData, saveDashboardData } from './dashboard-data.js';

    const role = localStorage.getItem('helloEducationRole');
    if (role !== 'tutor') {
      window.location.href = 'login.html?role=tutor';
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const welcomeMessage = document.getElementById('welcomeMessage');
    const summaryText = document.getElementById('summaryText');
    const sessionList = document.getElementById('sessionList');
    const requestList = document.getElementById('requestList');
    const availabilityList = document.getElementById('availabilityList');
    const signOutBtn = document.getElementById('signOutBtn');

    async function renderDashboard() {
      const data = await fetchDashboardData('tutor');
      summaryText.textContent = data.summary;
      sessionList.innerHTML = data.sessions.map((session) => `<li>${session.title} — ${session.time} <span class="status-badge">${session.status}</span></li>`).join('');
      requestList.innerHTML = data.requests.map((request) => `
        <li>
          <div>${request.name} — ${request.subject}: ${request.note}</div>
          <div class="dashboard-actions">
            <span class="status-badge">${request.status}</span>
            <button class="action-btn" data-request="${request.name}" data-action="accept" type="button">Accept</button>
            <button class="action-btn secondary" data-request="${request.name}" data-action="decline" type="button">Decline</button>
          </div>
        </li>
      `).join('');
      availabilityList.innerHTML = data.availability.map((item) => `<li>${item.day}: ${item.time}</li>`).join('');
    }

    onAuthStateChanged(auth, (user) => {
      if (!user && !isFirebaseConfigured()) {
        welcomeMessage.textContent = `Welcome back, ${localStorage.getItem('helloEducationUser') || 'tutor'}!`;
        renderDashboard();
        return;
      }

      if (!user) {
        window.location.href = 'login.html?role=tutor';
        return;
      }

      welcomeMessage.textContent = `Welcome back, ${user.email || 'tutor'}!`;
      renderDashboard();
    });

    requestList.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-request]');
      if (!button) return;

      const data = await fetchDashboardData('tutor');
      const requestName = button.dataset.request;
      const request = data.requests.find((item) => item.name === requestName);
      if (!request) return;

      request.status = button.dataset.action === 'accept' ? 'Accepted' : 'Declined';
      await saveDashboardData('tutor', data);
      await renderDashboard();
    });

    signOutBtn.addEventListener('click', async () => {
      if (!isFirebaseConfigured()) {
        localStorage.removeItem('helloEducationRole');
        localStorage.removeItem('helloEducationUser');
        window.location.href = 'login.html?role=tutor';
        return;
      }

      await signOut(auth);
    });
  </script>
</body>
</html>
