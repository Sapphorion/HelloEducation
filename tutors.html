<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Meet HelloEducation's tutors and book a session — matric, general Grade 1-12 tutoring, homeschool support and more." />
    <link rel="stylesheet" href="styling.css">
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#085041" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HelloEducation" />
    <title>Tutors - Book Your Session</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #085041;
            min-height: 100vh;
            padding: 20px 20px 40px;
        }

        header {
            color: white;
            padding: 0.5rem 1rem;
            text-align: center;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .container {
            width: 100%;
        }

        .page-heading {
            font-size: 1.25rem;
            margin-bottom: 10px;
        }

        .tutors-status {
            color: white;
            text-align: center;
            grid-column: 1 / -1;
        }

        .tutors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        @media (max-width: 768px) {
            .page-heading {
                font-size: 1rem;
                margin-bottom: 8px;
            }

            .tutors-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            body {
                padding: 16px 15px 30px;
            }

            main {
                margin: 1rem auto;
                padding: 0 0.5rem;
            }
        }

        @media (max-width: 480px) {
            .page-heading {
                font-size: 0.9rem;
                margin-bottom: 6px;
            }

            .tutor-name {
                font-size: 1.2em;
            }

            .tutor-subject {
                font-size: 0.9em;
            }

            .tutor-bio {
                font-size: 0.85em;
                margin-bottom: 12px;
            }

            .tutor-image,
            .tutor-image-placeholder {
                width: 140px;
                height: 140px;
            }

            .tutor-info {
                padding: 15px;
            }
        }

        .tutor-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .tutor-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .tutor-image,
        .tutor-image-placeholder {
            width: 160px;
            height: 160px;
            display: block;
            margin: 20px auto 0;
            border-radius: 12px;
        }

        .tutor-image {
            object-fit: cover;
            object-position: center;
            background: #e0e0e0;
        }

        .tutor-image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #E1F5EE;
            color: #085041;
            font-size: 3rem;
            font-weight: 700;
        }

        .tutor-info {
            padding: 20px;
        }

        .tutor-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .tutor-subject {
            color: #0F6E56;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .tutor-bio {
            color: #666;
            font-size: 0.95em;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px 15px 30px;
            }

            .page-heading {
                font-size: 1rem;
                margin-bottom: 8px;
            }

            main {
                margin: 1rem auto;
                padding: 0 0.5rem;
            }

            .tutors-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .tutor-bio {
                font-size: 0.9em;
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="images/HELLO..jpg" alt="HelloEducation" class="site-logo" />
        <h1 class="page-heading">Find Your Perfect Tutor</h1>
    </header>
    <navigation>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="tutors.html">Tutors</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </navigation>
    <main>
        <div class="container">
            <div class="tutors-grid" id="tutorsGrid">
                <p class="tutors-status">Loading tutors&hellip;</p>
            </div>
        </div>
    </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-functions.js';
    import { firebaseConfig, isFirebaseConfigured } from './firebase-config.js';

    const tutorsGrid = document.getElementById('tutorsGrid');

    function renderTutorCard(tutor) {
      const imageHtml = tutor.photoUrl
        ? `<img src="${tutor.photoUrl}" alt="${tutor.name}" class="tutor-image">`
        : `<div class="tutor-image-placeholder">${(tutor.name || '?').trim().charAt(0).toUpperCase()}</div>`;

      return `
        <div class="tutor-card">
          ${imageHtml}
          <div class="tutor-info">
            <div class="tutor-name">${tutor.name}</div>
            ${tutor.subject ? `<div class="tutor-subject">${tutor.subject}</div>` : ''}
            ${tutor.bio ? `<div class="tutor-bio">${tutor.bio}</div>` : ''}
            <a class="book-btn" href="login.html?tutorId=${encodeURIComponent(tutor.id)}">Book a Session</a>
          </div>
        </div>
      `;
    }

    async function loadTutors() {
      if (!isFirebaseConfigured()) {
        tutorsGrid.innerHTML = '<p class="tutors-status">Demo mode is active. Connect Firebase to see real tutors.</p>';
        return;
      }

      const app = initializeApp(firebaseConfig);
      const functions = getFunctions(app);
      const getPublicTutorsCallable = httpsCallable(functions, 'getPublicTutors');

      try {
        const result = await getPublicTutorsCallable();
        const tutors = result.data.tutors || [];

        tutorsGrid.innerHTML = tutors.length
          ? tutors.map(renderTutorCard).join('')
          : '<p class="tutors-status">No tutors listed right now — please check back soon.</p>';
      } catch (error) {
        tutorsGrid.innerHTML = `<p class="tutors-status">${error.message || 'Could not load tutors right now. Please try again shortly.'}</p>`;
      }
    }

    loadTutors();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
