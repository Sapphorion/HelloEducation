<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelloEducation Parent — Billing</title>
  <link rel="stylesheet" href="styling.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#085041" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HelloEducation" />
</head>
<body>
  <header>
    <h1>HelloEducation</h1>
    <h1 class="page-heading">Parent — Billing</h1>
  </header>

  <navigation>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="tutors.html">Tutors</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </navigation>

  <main class="auth-page">
    <section class="auth-panel dashboard-panel">
      <div class="admin-subnav">
        <a href="parent-dashboard.html">Overview</a>
        <a href="parent-children.html">My Children</a>
        <a href="parent-schedule.html">Schedule</a>
        <a href="parent-billing.html" class="active">Billing</a>
      </div>

      <h2 id="welcomeMessage">Billing</h2>
      <p id="summaryText">Invoices and your account statement.</p>

      <div class="dashboard-card" id="billingCard">
        <h3>Invoices &amp; statement</h3>
        <p class="card-hint" id="billingSummary">Loading billing details…</p>
        <div id="billingStatement"></div>
        <div id="billingInvoices"></div>
        <p class="auth-feedback" id="billingFeedback"></p>
      </div>

      <button id="signOutBtn" type="button">Sign Out</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 HelloEducation. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
    import { getFirestore } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
    import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-functions.js';
    import { firebaseConfig, isFirebaseConfigured } from './firebase-config.js';

    const role = localStorage.getItem('helloEducationRole');
    if (role !== 'parent') {
      window.location.href = 'login.html?role=parent';
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const functions = getFunctions(app);
    const getParentBillingCallable = httpsCallable(functions, 'getParentBilling');
    const getInvoicePdfCallable = httpsCallable(functions, 'getInvoicePdf');
    const welcomeMessage = document.getElementById('welcomeMessage');
    const summaryText = document.getElementById('summaryText');
    const signOutBtn = document.getElementById('signOutBtn');
    const billingSummary = document.getElementById('billingSummary');
    const billingStatement = document.getElementById('billingStatement');
    const billingInvoices = document.getElementById('billingInvoices');
    const billingFeedback = document.getElementById('billingFeedback');

    function statusLabel(status) {
      return (status || '').replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase()) || 'Unknown';
    }

    function formatCurrency(amount) {
      return `R${(Number(amount) || 0).toFixed(2)}`;
    }

    async function renderBilling() {
      billingSummary.textContent = 'Loading billing details…';
      billingStatement.innerHTML = '';
      billingInvoices.innerHTML = '';
      billingFeedback.textContent = '';

      try {
        const result = await getParentBillingCallable();
        const { linked, invoices, payments, statement } = result.data;

        if (!linked) {
          billingSummary.textContent = 'No billing account is linked to your email yet. Contact the HelloEducation admin if you believe this is a mistake.';
          return;
        }

        billingSummary.textContent = `${invoices.length} ${invoices.length === 1 ? 'invoice' : 'invoices'} on file.`;

        billingStatement.innerHTML = `
          <div class="dashboard-card">
            <h4>Account statement</h4>
            <p>Total invoiced: ${formatCurrency(statement.totalInvoiced)}</p>
            <p>Total paid: ${formatCurrency(statement.totalPaid)}</p>
            <p><strong>Outstanding balance: ${formatCurrency(statement.outstandingBalance)}</strong></p>
            ${payments.length ? `<h4>Payments</h4><ul>${payments.map((p) => `<li>${p.date} — ${formatCurrency(p.amount)}${p.reference ? ` (${p.reference})` : ''}</li>`).join('')}</ul>` : ''}
          </div>
        `;

        billingInvoices.innerHTML = invoices.length
          ? `<ul>${invoices.map((inv) => `
              <li>
                <span>${inv.invoiceNumber} — ${inv.date} <span class="status-badge">${statusLabel(inv.status)}</span> — ${formatCurrency(inv.total)}${inv.balance > 0 ? ` (${formatCurrency(inv.balance)} due)` : ''}</span>
                <button type="button" class="action-btn view-invoice-btn" data-invoice-id="${inv.invoiceId}">View PDF</button>
              </li>
            `).join('')}</ul>`
          : '<p>No invoices yet.</p>';
      } catch (error) {
        billingSummary.textContent = error.message || 'Could not load your billing details.';
      }
    }

    billingInvoices.addEventListener('click', async (event) => {
      const btn = event.target.closest('.view-invoice-btn');
      if (!btn) return;

      billingFeedback.textContent = 'Loading PDF…';
      btn.disabled = true;
      try {
        const result = await getInvoicePdfCallable({ invoiceId: btn.dataset.invoiceId });
        const { pdfBase64 } = result.data;
        const byteChars = atob(pdfBase64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/pdf' });
        window.open(URL.createObjectURL(blob), '_blank');
        billingFeedback.textContent = '';
      } catch (error) {
        billingFeedback.textContent = error.message || 'Could not load the invoice PDF.';
      } finally {
        btn.disabled = false;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user && !isFirebaseConfigured()) {
        welcomeMessage.textContent = 'Billing';
        summaryText.textContent = 'Demo mode is active. Connect Firebase to see real data.';
        billingSummary.textContent = 'Billing is unavailable in demo mode.';
        return;
      }

      if (!user) {
        window.location.href = 'login.html?role=parent';
        return;
      }

      renderBilling();
    });

    signOutBtn.addEventListener('click', async () => {
      if (!isFirebaseConfigured()) {
        localStorage.removeItem('helloEducationRole');
        localStorage.removeItem('helloEducationUser');
        window.location.href = 'login.html?role=parent';
        return;
      }

      await signOut(auth);
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
