<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelloEducation Login</title>
  <link rel="stylesheet" href="styling.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#085041" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HelloEducation" />
</head>
<body>
  <header>
    <img src="images/HELLO..jpg" alt="HelloEducation" class="site-logo" />
    <h1 class="page-heading">Login</h1>
  </header>

  <navigation>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="tutors.html">Tutors</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </navigation>

  <main class="auth-page">
    <section class="auth-panel" aria-label="Authentication panel">
      <div class="auth-tabs" role="tablist" aria-label="Login type">
        <button class="auth-tab active" type="button" data-role="student">Student</button>
        <button class="auth-tab" type="button" data-role="tutor">Tutor</button>
        <button class="auth-tab" type="button" data-role="parent">Parent</button>
        <button class="auth-tab" type="button" data-role="matricStudent">Second Chance</button>
        <button class="auth-tab" type="button" data-role="admin">Admin</button>
      </div>

      <h2 id="authTitle">Student Login</h2>
      <p id="authDescription">Sign in to access your student dashboard.</p>

      <form id="authForm">
        <input id="email" type="email" placeholder="Email address" required />
        <input id="password" type="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
      </form>

      <p class="auth-feedback" id="authFeedback"></p>
      <button class="auth-toggle" type="button" id="toggleMode">Need an account? Contact HelloEducation</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 HelloEducation. All rights reserved.</p>
  </footer>

  <script type="module">
    import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
    import { firebaseConfig, isFirebaseConfigured } from './firebase-config.js';
    import { createUserRoleDocument } from './firestore-setup.js';

    const VALID_ROLES = ['student', 'tutor', 'parent', 'admin', 'matricStudent'];
    const DASHBOARD_URLS = {
      student: 'student-dashboard.html',
      tutor: 'tutor-dashboard.html',
      parent: 'parent-dashboard.html',
      admin: 'admin-dashboard.html',
      matricStudent: 'matric-dashboard.html'
    };

    const params = new URLSearchParams(window.location.search);
    const roleFromUrl = params.get('role');
    let activeRole = VALID_ROLES.includes(roleFromUrl) ? roleFromUrl : 'student';

    // Arrives here from a tutor's "Book a Session" link on the public
    // tutors.html page — carried through to the booking pages below so the
    // student/parent lands with that tutor already selected, instead of
    // losing the context they came in with.
    const tutorId = params.get('tutorId');

    function destinationUrl(role) {
      if (tutorId && (role === 'student' || role === 'parent')) {
        return `${DASHBOARD_URLS[role].replace('-dashboard.html', '-schedule.html')}?tutorId=${encodeURIComponent(tutorId)}`;
      }
      return DASHBOARD_URLS[role];
    }

    const tabs = document.querySelectorAll('.auth-tab');
    const form = document.getElementById('authForm');
    const title = document.getElementById('authTitle');
    const description = document.getElementById('authDescription');
    const feedback = document.getElementById('authFeedback');

    const isDemoMode = !isFirebaseConfigured();

    let auth = null;
    let db = null;

    if (!isDemoMode) {
      // firestore-setup.js (imported above) already initializes the default
      // app at module load, so reuse it rather than calling initializeApp
      // again — a second call throws app/duplicate-app and kills this script,
      // which would leave the sign-in form with no submit handler.
      const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    }

    function setRole(role) {
      activeRole = role;
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.role === role));
      if (role === 'tutor') {
        title.textContent = 'Tutor Login';
        description.textContent = 'Sign in to manage tutoring sessions and availability.';
      } else if (role === 'parent') {
        title.textContent = 'Parent Login';
        description.textContent = "Sign in to see your child's schedule, progress, and tutor feedback.";
      } else if (role === 'admin') {
        title.textContent = 'Admin Login';
        description.textContent = 'Sign in to manage tutor profiles and protected portal data.';
      } else if (role === 'matricStudent') {
        title.textContent = 'Second Chance Programme Login';
        description.textContent = 'Sign in to see your Second Chance Programme (matric re-write) timetable and assessments.';
      } else {
        title.textContent = 'Student Login';
        description.textContent = 'Sign in to access your student dashboard.';
      }
      feedback.textContent = '';
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => setRole(tab.dataset.role));
    });

    setRole(activeRole);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        feedback.textContent = 'Please enter both your email and password.';
        return;
      }

      if (isDemoMode) {
        localStorage.setItem('helloEducationRole', activeRole);
        localStorage.setItem('helloEducationUser', email);
        feedback.textContent = 'Demo mode active. Your sign-in preview is ready.';
        window.location.href = destinationUrl(activeRole);
        return;
      }

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const userDoc = await getDoc(doc(db, 'users', userCredential.user.uid));
        const roleFromDb = userDoc.exists() ? userDoc.data().role : null;

        if (!userDoc.exists()) {
          if (activeRole !== 'student') {
            feedback.textContent = `This account has not been set up for the ${activeRole} role yet. Please contact the HelloEducation admin.`;
            await signOut(auth);
            return;
          }
          await createUserRoleDocument(userCredential.user.uid, 'student', userCredential.user.email || '', userCredential.user.displayName || '');
        } else if (roleFromDb !== activeRole) {
          feedback.textContent = `This account is not assigned to the ${activeRole} role.`;
          await signOut(auth);
          return;
        }

        localStorage.setItem('helloEducationRole', activeRole);
        localStorage.setItem('helloEducationUser', userCredential.user.email || '');
        feedback.textContent = 'Signing you in...';
        window.location.href = destinationUrl(activeRole);
      } catch (error) {
        feedback.textContent = error.message || 'Unable to sign in.';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
